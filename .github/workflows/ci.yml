name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/
          ruff format --check src/

      - name: Validate skill schema
        run: python scripts/validate_skills.py

      - name: Run tests
        run: |
          pytest tests/ -v

  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify skills are bundled in wheel
        run: |
          python -c "
          import zipfile, sys
          from pathlib import Path
          wheels = list(Path('dist').glob('*.whl'))
          assert wheels, 'No wheel found'
          with zipfile.ZipFile(wheels[0]) as zf:
              skill_files = [f for f in zf.namelist() if 'skills/data/' in f and f.endswith('SKILL.md')]
              if not skill_files:
                  print('ERROR: No skill files bundled in wheel!', file=sys.stderr)
                  sys.exit(1)
              print(f'OK: {len(skill_files)} skills bundled in wheel')
          "

      - name: Verify pip install from wheel works
        run: |
          pip install dist/*.whl
          databricks-agent --help
          databricks-agent skills list

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
